services:
  - type: web
    name: fuel-assistant-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: ACTIONS_API_KEY
        sync: false
      - key: ACTIONS_PUBLIC_BASE_URL
        sync: false
      - key: CHAT_MAX_COMPLETION_TOKENS
        value: '800'
      - key: CHAT_REQUESTS_PER_MINUTE
        value: '5'
      - key: CHAT_DAILY_REQUEST_LIMIT
        value: '100'
